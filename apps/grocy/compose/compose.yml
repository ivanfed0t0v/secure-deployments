services:
  grocy:
    # Required by linuxserver s6-overlay init: sets up /config ownership and
    # drops from root to PUID:PGID before starting nginx/php-fpm.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    environment:
      TZ: UTC
      # linuxserver privilege-drop target; must match chown on host ./config
      PUID: 10020
      PGID: 10021
    healthcheck:
      test: [CMD, curl, --fail, http://localhost/]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    # https://hub.docker.com/r/linuxserver/grocy
    image: lscr.io/linuxserver/grocy:4.6.0@sha256:14fb03065528ff4f9e5c1578794732830cb129b0172a791dee46a40a61184b6e
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      # exec required: s6-overlay extracts and runs binaries under /run/s6/
      - /run:rw,exec,nosuid,nodev
      - /var/log:rw,noexec,nosuid,nodev
    volumes:
      - ./config:/config:rw
