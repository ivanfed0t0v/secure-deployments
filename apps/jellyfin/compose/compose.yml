services:
  jellyfin:
    cap_drop:
      - ALL
    environment:
      TZ: UTC
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8096/health]
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 10s
    # https://hub.docker.com/r/jellyfin/jellyfin
    image: ghcr.io/jellyfin/jellyfin:10.11.11
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    user: 10010:10011
    tmpfs:
      - /tmp:rw
      - /run:exec
    volumes:
      - ./config:/config:rw
      - ./cache:/cache:rw
      - ./media:/media:rw
